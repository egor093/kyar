<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="circleGradient">
            <stop offset="10%" stop-color="green"/>
            <stop offset="100%" stop-color="orange"/>
        </linearGradient>
    </defs>
    <circle id="kv" stroke="orange" stroke-width="3" fill="blue" cx="50" cy="50" r="45">
        <animate xlink:href="#kv" attributeName="stroke" from="orange" to="magenta" begin="mouseover" dur="5s"/>
    </circle>
    <rect id="rectangle" stroke="orange" stroke-width="3" fill="pink" x="100" height="100" width="100">
        <animate xlink:href="#rectangle" attributeName="stroke" dur="3s" from="white" to="magenta" begin="0s" repeatCount="indefinite"></animate>
    </rect>

    <ellipse id="ellipse" rx="70" ry="35" cx="280" cy="50" fill="purple">
        <animate xlink:href="#ellipse" begin="click" dur="3s" attributeName="fill" from="pink" to="red"></animate>
    </ellipse>

    <polygon   fill="url(#circleGradient)" points="350 100, 400 0, 450 100"></polygon>

    <polyline points="10 110, 250 110, 160 160, 460 160" stroke="purple" stroke-width="2" fill="none"></polyline>
</svg>
</body>
</html>
